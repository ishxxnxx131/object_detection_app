<!-- templates/webcam.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Object Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="panel">
                <h2>Webcam Control</h2>
                <button id="start-webcam" class="primary-btn">Start Webcam</button>
                <button id="stop-webcam" class="primary-btn" style="background-color: #f44336; margin-top: 10px;">Stop Webcam</button>
                <div class="slider-container" style="margin-top: 15px;">
                    <label for="confidence-threshold">Confidence Threshold: <span id="threshold-value">0.5</span></label>
                    <input type="range" id="confidence-threshold" min="0.1" max="1.0" step="0.1" value="0.5">
                </div>
            </div>
            
            <div class="panel">
                <h2>Navigation</h2>
                <button onclick="window.location.href='/'" class="primary-btn">Back to Image Upload</button>
            </div>
        </div>

        <div class="main-content">
            <div class="file-preview">
                <h2>Live Webcam Feed</h2>
                <div id="preview-container">
                    <img id="webcam-feed" src="{{ url_for('video_feed') }}" alt="Webcam Feed" style="display: none;">
                    <p id="webcam-status">Click "Start Webcam" to begin detection.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startWebcamBtn = document.getElementById('start-webcam');
            const stopWebcamBtn = document.getElementById('stop-webcam');
            const confidenceThreshold = document.getElementById('confidence-threshold');
            const thresholdValue = document.getElementById('threshold-value');
            const webcamFeed = document.getElementById('webcam-feed');
            const webcamStatus = document.getElementById('webcam-status');
            
            // Update threshold value display
            confidenceThreshold.addEventListener('input', function() {
                thresholdValue.textContent = this.value;
            });
            
            // Start webcam
            startWebcamBtn.addEventListener('click', function() {
                const formData = new FormData();
                formData.append('confidence_threshold', confidenceThreshold.value);
                
                fetch('/start_webcam', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        webcamFeed.style.display = 'block';
                        webcamStatus.style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            });
            
            // Stop webcam
            stopWebcamBtn.addEventListener('click', function() {
                fetch('/stop_webcam', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    webcamFeed.style.display = 'none';
                    webcamStatus.style.display = 'block';
                    webcamStatus.textContent = 'Webcam stopped. Click "Start Webcam" to begin again.';
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            });
        });

        const classFilters = document.createElement('div');
classFilters.id = 'class-filters';
classFilters.style.maxHeight = '200px';
classFilters.style.overflowY = 'auto';

// Create a panel for class filters
const filterPanel = document.createElement('div');
filterPanel.className = 'panel';
filterPanel.innerHTML = '<h2>Class Filters</h2>';
filterPanel.appendChild(classFilters);

// Add the filter panel to the sidebar
document.querySelector('.sidebar').appendChild(filterPanel);

// Class color map
const classColorMap = {};

// Load all YOLO classes
fetch('/get_classes')
    .then(response => response.json())
    .then(data => {
        // Sort classes alphabetically
        const sortedClasses = data.classes.sort();
        
        // Create a "Select All" checkbox
        const allContainer = document.createElement('div');
        allContainer.className = 'checkbox-container';
        
        const allCheckbox = document.createElement('input');
        allCheckbox.type = 'checkbox';
        allCheckbox.id = 'filter-all';
        allCheckbox.checked = true;
        
        const allLabel = document.createElement('label');
        allLabel.htmlFor = 'filter-all';
        allLabel.appendChild(document.createTextNode('Select All'));
        
        allContainer.appendChild(allCheckbox);
        allContainer.appendChild(allLabel);
        classFilters.appendChild(allContainer);
        
        // "Select All" checkbox functionality
        allCheckbox.addEventListener('change', function() {
            const checkboxes = classFilters.querySelectorAll('input[type="checkbox"]:not(#filter-all)');
            checkboxes.forEach(checkbox => {
                checkbox.checked = this.checked;
            });
            
            // We need to restart the webcam to apply filters
            if (webcamFeed.style.display === 'block') {
                // Restart webcam with current settings
                const formData = new FormData();
                formData.append('confidence_threshold', confidenceThreshold.value);
                
                fetch('/start_webcam', {
                    method: 'POST',
                    body: formData
                });
            }
        });
        
        // Create a container for the class checkboxes
        const classesContainer = document.createElement('div');
        classesContainer.className = 'classes-container';
        
        // Add class checkboxes
        sortedClasses.forEach(className => {
            // Generate a random color
            if (!classColorMap[className]) {
                const hue = Math.random() * 360;
                classColorMap[className] = `hsl(${hue}, 70%, 50%)`;
            }
            
            const filterContainer = document.createElement('div');
            filterContainer.className = 'checkbox-container';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `filter-${className}`;
            checkbox.checked = true;
            checkbox.dataset.class = className;
            
            const label = document.createElement('label');
            label.htmlFor = `filter-${className}`;
            
            const colorSwatch = document.createElement('span');
            colorSwatch.className = 'detection-color';
            colorSwatch.style.backgroundColor = classColorMap[className];
            
            label.appendChild(colorSwatch);
            label.appendChild(document.createTextNode(` ${className}`));
            
            filterContainer.appendChild(checkbox);
            filterContainer.appendChild(label);
            
            classesContainer.appendChild(filterContainer);
        });
        
        classFilters.appendChild(classesContainer);
    })
    .catch(error => {
        console.error('Error loading classes:', error);
        classFilters.innerHTML = '<p>Error loading classes</p>';
    });
    
    </script>
</body>
</html>
