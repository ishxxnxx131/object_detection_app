<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Leak Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="panel">
                <h2>Source</h2>
                <select id="source-select" class="source-dropdown">
                    <option value="" disabled selected>Select Source</option>
                    <option value="local">Local Repository</option>
                    <option value="upload">Upload File</option>
                    <option value="webcam">Web Camera</option>
                </select>
                
                <div id="file-upload-container" class="hidden">
                    <div class="file-upload">
                        <input type="file" id="file-input" accept="image/*,video/*" hidden>
                        <button id="choose-file-btn">Choose File</button>
                        <span id="file-name">No file chosen</span>
                    </div>
                    <button id="upload-btn" class="primary-btn">Upload</button>
                </div>
            </div>

            <div class="panel">
                <div class="navigation-controls">
                    <button id="first-frame" class="nav-btn">«</button>
                    <button id="prev-frame" class="nav-btn">‹</button>
                    <span id="frame-counter">1 / 0</span>
                    <button id="next-frame" class="nav-btn">›</button>
                    <button id="last-frame" class="nav-btn">»</button>
                    <button id="play-btn" class="play-btn">▶</button>
                </div>
                <div class="current-file">
                    <span>Current file: No file selected</span>
                </div>
            </div>

            <div class="panel">
                <h2>Analysis Logs</h2>
                <div id="analysis-logs" class="analysis-logs">
                    <!-- Analysis logs will be displayed here -->
                </div>
            </div>

            <div class="panel">
                <h2>Model Selection</h2>
                <select id="model-select">
                    <option value="YOLOv3">YOLOv3</option>
                    <option value="YOLOv4">YOLOv4</option>
                    <option value="YOLOv8">YOLOv8</option>
                </select>
            </div>

            <div class="panel">
                <h2>Detection Settings</h2>
                <div class="slider-container">
                    <label for="confidence-threshold">Confidence Threshold: <span id="threshold-value">0.5</span></label>
                    <input type="range" id="confidence-threshold" min="0.1" max="1.0" step="0.1" value="0.5">
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="show-boxes" checked>
                    <label for="show-boxes">Show Bounding Boxes</label>
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="show-labels" checked>
                    <label for="show-labels">Show Labels</label>
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="show-confidence" checked>
                    <label for="show-confidence">Show Confidence</label>
                </div>
            </div>

            <div class="panel">
                <h2>Class Filters</h2>
                <div id="class-filters">
                    <!-- Filters will be added dynamically -->
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="file-preview">
                <h2 id="file-preview-title">Preview</h2>
                <div id="preview-container">
                    <div id="loading-indicator" class="loading-indicator">
                        <div class="hourglass-icon"></div>
                        <p>Connecting to Source...</p>
                    </div>
                    <img id="preview-image" class="hidden" src="{{ url_for('static', filename='images/placeholder.png') }}" alt="Preview">
                    <video id="preview-video" class="hidden" controls></video>
                    <canvas id="detection-canvas" width="800" height="600"></canvas>
                </div>
            </div>

            <div class="results-panel">
                <h2>Current Analysis</h2>
                <div id="current-analysis-container">
                    <!-- Current analysis will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
